
name: my_story
description: MY STORY - Private Two Person Messenger
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_localizations:
    sdk: flutter
  shared_preferences: ^2.5.3
  local_auth: ^2.3.0
  flutter_secure_storage: ^9.2.4
  connectivity_plus: ^6.1.4
  file_picker: ^10.1.2
  image_picker: ^1.1.2
  permission_handler: ^12.0.0
  firebase_core: ^4.2.1
  firebase_auth: ^6.1.1
  cloud_firestore: ^6.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "moon_icon.png"
  min_sdk_android: 21
